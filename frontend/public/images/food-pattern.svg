<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" stroke="#222222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- PIZZA SLICE (top left) -->
    <g transform="translate(30, 25) rotate(-12)">
        <!-- Crust -->
        <path d="M 12 18 Q 40 8 70 20" />
        <path d="M 10 24 Q 40 14 72 26" />
        <!-- Triangle slice body -->
        <path d="M 10 24 L 40 92 L 72 26" />
        <!-- Pepperoni -->
        <circle cx="36" cy="40" r="7" />
        <circle cx="48" cy="62" r="6" />
        <circle cx="28" cy="66" r="5" />
        <!-- Cheese drips / details -->
        <path d="M 40 92 Q 38 102 36 94" />
        <circle cx="42" cy="28" r="1.5" fill="#222" />
        <circle cx="56" cy="45" r="1.5" fill="#222" />
    </g>

    <!-- BURGER (top right) -->
    <g transform="translate(225, 30) rotate(10)">
        <!-- Top Bun -->
        <path d="M 10 38 Q 45 6 80 38 Z" />
        <!-- Sesame seeds -->
        <path d="M 32 24 L 35 23" />
        <path d="M 46 19 L 49 20" />
        <path d="M 60 26 L 63 24" />
        <!-- Lettuce waves -->
        <path d="M 8 42 Q 18 36 28 42 Q 38 48 48 42 Q 58 36 68 42 Q 78 48 84 42" />
        <!-- Patty -->
        <rect x="12" y="46" width="68" height="11" rx="5.5" />
        <!-- Cheese corner -->
        <path d="M 20 48 L 40 58 L 54 48" />
        <!-- Bottom Bun -->
        <path d="M 14 62 Q 46 64 78 62 C 78 72 70 76 46 76 C 22 76 14 72 14 62 Z" />
    </g>

    <!-- SHAWURMA / DONER WRAP (center left) -->
    <g transform="translate(35, 175) rotate(15)">
        <!-- Tortilla wrap roll -->
        <path d="M 15 28 C 15 15 32 8 48 15 C 62 22 68 36 62 78 C 58 104 42 110 30 108 C 18 106 12 96 15 75 Z" />
        <!-- Foil wrap line at bottom -->
        <path d="M 13 65 C 25 72 45 74 63 60" />
        <path d="M 12 85 C 22 93 40 94 58 80" />
        <!-- Diagonal grill marks -->
        <line x1="28" y1="28" x2="42" y2="24" />
        <line x1="25" y1="42" x2="45" y2="38" />
        <line x1="24" y1="56" x2="48" y2="52" />
        <!-- Top open ingredients -->
        <path d="M 24 16 Q 30 10 38 15" />
        <path d="M 36 12 Q 44 8 48 16" />
        <circle cx="34" cy="20" r="2" fill="#222" />
    </g>

    <!-- SUSHI & ROLLS (center / bottom center) -->
    <g transform="translate(195, 170) rotate(-8)">
        <!-- Roll 1 (front) -->
        <ellipse cx="40" cy="30" rx="28" ry="16" />
        <path d="M 12 30 C 12 48 18 64 40 64 C 62 64 68 48 68 30" />
        <!-- Inner filling -->
        <ellipse cx="40" cy="30" rx="14" ry="8" />
        <rect x="34" y="26" width="12" height="8" rx="2" />
        <!-- Seeds/roe on top -->
        <circle cx="24" cy="26" r="1.5" fill="#222" />
        <circle cx="56" cy="28" r="1.5" fill="#222" />
        <circle cx="30" cy="36" r="1.5" fill="#222" />
        <circle cx="50" cy="35" r="1.5" fill="#222" />
    </g>

    <!-- NIGIRI SUSHI (bottom left) -->
    <g transform="translate(45, 275) rotate(-10)">
        <!-- Rice block -->
        <rect x="15" y="26" width="46" height="20" rx="9" />
        <!-- Fish topping -->
        <path d="M 10 26 C 14 14 36 12 55 16 C 68 19 72 26 66 32 C 55 35 30 33 10 26 Z" />
        <!-- Nori ribbon -->
        <rect x="32" y="15" width="12" height="32" rx="2" />
        <!-- Salmon texture streaks -->
        <path d="M 22 22 Q 26 18 30 20" />
        <path d="M 48 20 Q 54 22 58 24" />
    </g>

    <!-- DRINK CUP WITH STRAW (bottom right) -->
    <g transform="translate(230, 260) rotate(8)">
        <!-- Drink cup with straw -->
        <path d="M 22 30 L 28 85 C 28 89 54 89 54 85 L 60 30" />
        <path d="M 18 30 C 18 26 64 26 64 30 Z" />
        <path d="M 30 26 C 30 21 52 21 52 26" />
        <!-- Straw -->
        <path d="M 43 23 L 48 4 L 59 7" />
        <!-- Cup sleeve band -->
        <path d="M 24 48 C 34 52 48 52 58 48" />
        <path d="M 26 66 C 36 70 46 70 56 66" />
        <!-- Ice cubes inside or coffee cup icon -->
        <circle cx="41" cy="58" r="5" />
    </g>

    <!-- FRENCH FRIES (middle center) -->
    <g transform="translate(135, 75) rotate(-15)">
        <!-- Box -->
        <path d="M 18 35 L 24 72 C 24 75 48 75 48 72 L 54 35" />
        <path d="M 18 35 Q 36 44 54 35" />
        <!-- Fry sticks sticking out -->
        <line x1="24" y1="36" x2="22" y2="12" />
        <line x1="28" y1="38" x2="30" y2="8" />
        <line x1="36" y1="39" x2="36" y2="6" />
        <line x1="42" y1="38" x2="45" y2="10" />
        <line x1="47" y1="36" x2="51" y2="16" />
        <!-- fry tip tops -->
        <line x1="20" y1="12" x2="25" y2="12" />
        <line x1="28" y1="8" x2="33" y2="8" />
        <line x1="34" y1="6" x2="39" y2="6" />
        <line x1="43" y1="10" x2="48" y2="10" />
        <line x1="49" y1="16" x2="54" y2="16" />
        <!-- Smile emblem on box -->
        <path d="M 29 55 Q 36 62 43 55" />
    </g>

    <!-- DECORATIVE ACCENTS (sparks, stars, dots filling gaps) -->
    <!-- Top center -->
    <path d="M 180 20 L 180 28 M 176 24 L 184 24" />
    <circle cx="110" cy="35" r="2" fill="#222" />
    <circle cx="125" cy="45" r="1" fill="#222" />

    <!-- Center -->
    <path d="M 145 190 Q 148 183 155 185 Q 148 187 145 194 Q 142 187 135 185 Q 142 183 145 176 Z" fill="#222" stroke="none" />
    <circle cx="160" cy="225" r="2.5" fill="#222" />
    <circle cx="130" cy="245" r="1.5" fill="#222" />

    <!-- Left & Right edges -->
    <path d="M 15 130 L 15 136 M 12 133 L 18 133" />
    <circle cx="20" cy="240" r="2" fill="#222" />
    <path d="M 335 145 Q 338 138 345 140 Q 338 142 335 149 Q 332 142 325 140 Q 332 138 335 131 Z" fill="#222" stroke="none" />
    <circle cx="330" cy="230" r="2" fill="#222" />
    <circle cx="295" cy="140" r="1.5" fill="#222" />

    <!-- Bottom -->
    <path d="M 160 330 L 160 338 M 156 334 L 164 334" />
    <circle cx="205" cy="335" r="2" fill="#222" />
    <circle cx="105" cy="325" r="1.5" fill="#222" />
</svg>
