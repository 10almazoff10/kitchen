spring.application.name=kitchen

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:kitchen}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:kitchen-jwt-secret-key-that-is-at-least-256-bits-long-kitchen-app-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Active Directory / LDAP Configuration
ldap.enabled=${LDAP_ENABLED:false}
ldap.url=${LDAP_URL:ldap://localhost:389}
ldap.domain=${LDAP_DOMAIN:example.com}
ldap.base-dn=${LDAP_BASE_DN:dc=example,dc=com}
ldap.user-dn-pattern=${LDAP_USER_DN_PATTERN:uid={0},ou=users,dc=example,dc=com}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
server.forward-headers-strategy=framework

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

telegram.bot.token=${TG_BOT_TOKEN:123123}
telegram.chat.id=${TB_BOT_CHAT_ID:123123}

kitchen.base-url=${BASE_URL:${EXTERNAL_URL:http://localhost:8080}}

app.version:2.3.0
app.headerName: KITCHEN

# TimeZone
spring.jackson.time-zone=Asia/Barnaul