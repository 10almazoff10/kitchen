<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: common-head"></head>

<body>

<!-- Header с логотипом -->
<header th:replace="fragments/common :: common-header"></header>

<div class="auth-container">
    <main class="auth-form auth-form-wide">
        <h1 class="auth-title">Создать аккаунт</h1>
        <p class="auth-subtitle">Заполните форму для регистрации</p>
        
        <form method="post" th:action="@{/register}" id="registerForm" onsubmit="return validatePasswords()" class="modern-form">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="fullName" class="form-label">Имя и фамилия</label>
                <input type="text" id="fullName" name="fullName" class="form-control-modern" 
                       placeholder="Иван Иванов" th:value="${fullName}" required>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Логин</label>
                <input type="text" id="username" name="username" class="form-control-modern" 
                       placeholder="ivan" th:value="${username}" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-control-modern" 
                       placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Повторите пароль</label>
                <input type="password" id="confirmPassword" class="form-control-modern" 
                       placeholder="••••••••" required>
            </div>

            <!-- Сообщение о совпадении паролей -->
            <div id="passwordCheck" class="password-check" style="display: none;">
                <small id="passwordMessage"></small>
            </div>

            <div class="form-actions">
                <button class="btn-primary-modern w-100" type="submit">Зарегистрироваться</button>
                <a th:href="@{/login}" class="btn-secondary-modern w-100">Уже есть аккаунт? Войти</a>
            </div>
        </form>

        <div th:if="${error}" class="alert-error" role="alert">
            <span th:text="${error}"></span>
        </div>
    </main>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordCheck = document.getElementById('passwordCheck');
    const passwordMessage = document.getElementById('passwordMessage');

    function validatePasswords() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password !== confirmPassword) {
            passwordMessage.textContent = 'Пароли не совпадают!';
            passwordMessage.className = 'password-mismatch';
            passwordCheck.style.display = 'block';
            return false;
        }

        return true;
    }

    // Динамическая проверка при вводе
    confirmPasswordInput.addEventListener('input', function() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password === '' || confirmPassword === '') {
            passwordCheck.style.display = 'none';
            return;
        }

        if (password === confirmPassword) {
            passwordMessage.textContent = 'Пароли совпадают!';
            passwordMessage.className = 'password-match';
        } else {
            passwordMessage.textContent = 'Пароли не совпадают!';
            passwordMessage.className = 'password-mismatch';
        }

        passwordCheck.style.display = 'block';
    });
</script>

<footer th:replace="fragments/common :: common-footer"></footer>

</body>
</html>
