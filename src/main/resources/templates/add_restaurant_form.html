<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: common-head"></head>

<body>

<!-- Header с логотипом -->
<header th:replace="fragments/common :: common-header"></header>

<div class="main-content">
    <section class="form-section">
        <h1 class="form-title">Добавить ресторан</h1>
        
        <form method="post" th:action="@{/add-restaurant}" class="modern-form">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="name" class="form-label">Название ресторана</label>
                <input type="text" id="name" name="name" class="form-control-modern" 
                       placeholder="Например: Burger King" required>
            </div>

            <div class="form-group">
                <label for="websiteUrl" class="form-label">URL сайта</label>
                <input type="text" id="websiteUrl" name="websiteUrl" class="form-control-modern" 
                       placeholder="https://example.com" required>
            </div>

            <div class="form-actions">
                <button class="btn-primary-modern w-100" type="submit">Сохранить</button>
                <a th:href="@{/create-order}" class="btn-secondary-modern w-100">Назад</a>
            </div>
        </form>
    </section>
</div>

<footer th:replace="fragments/common :: common-footer"></footer>

</body>
</html>
