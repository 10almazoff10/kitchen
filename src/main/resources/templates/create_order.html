<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: common-head"></head>

<body>

<!-- Header с логотипом -->
<header th:replace="fragments/common :: common-header"></header>

<!-- Основной контент -->
<div class="main-content">
    <section class="form-section">
        <h1 class="form-title">Создать заказ</h1>
        
        <form method="post" th:action="@{/create-order}" class="modern-form">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="restaurantId" class="form-label">Ресторан</label>
                <div class="input-group-modern">
                    <select class="form-select-modern" id="restaurantId" name="restaurantId" required>
                        <option value="">-- Выберите ресторан --</option>
                        <option th:each="restaurant : ${restaurants}"
                                th:value="${restaurant.id}"
                                th:text="${restaurant.name}">
                        </option>
                    </select>
                    <a th:href="@{/add-restaurant}" class="btn-icon-modern" type="button" title="Добавить ресторан">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="form-group">
                <label for="deadline" class="form-label">Дедлайн заказа</label>
                <input type="datetime-local" id="deadline" name="deadline" class="form-control-modern" required>
            </div>

            <div class="form-group">
                <label for="paymentData" class="form-label">Способ оплаты</label>
                <input type="text" id="paymentData" name="paymentData" class="form-control-modern" 
                       placeholder="Например: 89014322344 - Т-банк" required>
            </div>
            
            <div class="form-group">
                <label for="comment" class="form-label">Комментарий к заказу</label>
                <input type="text" id="comment" name="comment" class="form-control-modern" 
                       placeholder="Например: Стоимость доставки будет рассчитана при завершении заказа">
            </div>

            <div class="form-actions">
                <button class="btn-primary-modern w-100" type="submit">Создать заказ</button>
                <a th:href="@{/}" class="btn-secondary-modern w-100">Назад</a>
            </div>
        </form>
    </section>
</div>

<!-- Bootstrap JS (опционально) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<footer th:replace="fragments/common :: common-footer"></footer>

</body>
</html>
