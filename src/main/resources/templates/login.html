<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: common-head"></head>

<body>

<!-- Header с логотипом -->
<header th:replace="fragments/common :: common-header"></header>

<div class="auth-container">
    <main class="auth-form">
        <h1 class="auth-title">Вход в систему</h1>
        <p class="auth-subtitle">Введите логин и пароль</p>
        
        <form method="post" th:action="@{/login}" class="modern-form">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username" class="form-label">Логин</label>
                <input type="text" id="username" name="username" class="form-control-modern" 
                       placeholder="Ваш логин" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-control-modern" 
                       placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <button class="btn-primary-modern w-100" type="submit">Войти</button>
                <a th:href="@{/register}" class="btn-secondary-modern w-100">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </form>
    </main>
</div>

<footer th:replace="fragments/common :: common-footer"></footer>

</body>
</html>
